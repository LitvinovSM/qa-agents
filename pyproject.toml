# Настройки проекта и зависимости (аналог pom.xml).

[project]
name = "qa-agents"
version = "0.1.0"
description = "Интенсив: ИИ-агенты для разбора упавших автотестов"
requires-python = ">=3.11"
# Рабочие зависимости (scope compile в Maven).
dependencies = [
    "requests>=2.31",
    "pydantic>=2.7",
]

[dependency-groups]
# Зависимости только для разработки (scope test в Maven).
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

# Сборка пакета src/qa_agents: нужна, чтобы `import qa_agents` работал из scripts/ и tests/.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qa_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
