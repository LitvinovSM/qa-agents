# =============================================================================
# pyproject.toml — главный файл настроек Python-проекта.
# Аналог pom.xml в Maven: имя проекта, версия, зависимости, настройки сборки
# и инструментов (pytest, ruff) — всё в одном месте.
# Формат файла — TOML: [секция] и строки вида ключ = значение.
# =============================================================================

[project]
# Имя проекта (как artifactId в Maven).
name = "qa-agents"
# Версия проекта (как <version> в Maven).
version = "0.1.0"
# Короткое описание — просто для людей.
description = "Интенсив: ИИ-агенты для разбора упавших автотестов"
# Минимальная версия Python, на которой проект запустится.
# 3.11+ нужен, потому что мы используем запись типов вида `str | None`.
requires-python = ">=3.11"
# Зависимости, нужные для РАБОТЫ программы (как <dependencies> со scope compile).
# requests — HTTP-клиент, наш «RestAssured без assert'ов».
# ">=2.31" значит «версия 2.31 или новее».
dependencies = [
    "requests>=2.31",
]

[dependency-groups]
# Зависимости только для РАЗРАБОТКИ (как scope test в Maven):
# в «боевой» запуск они не попадут, но uv поставит их тебе локально.
dev = [
    "pytest>=8.0",  # запуск тестов (аналог JUnit 5)
    "ruff>=0.5",    # линтер и форматтер (аналог Checkstyle + автоформат IDEA)
]

[build-system]
# Чем собирать наш пакет. Нужно, чтобы uv «установил» папку src/qa_agents
# внутрь виртуального окружения, и тогда `import qa_agents` работал из любого
# скрипта проекта. Аналог: `mvn install` кладёт твой модуль в локальный репозиторий,
# и другие модули могут его подключить.
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Где лежит код нашего пакета. Говорим сборщику: «пакет — это папка src/qa_agents».
packages = ["src/qa_agents"]

[tool.pytest.ini_options]
# Где pytest ищет тесты (как src/test/java в Maven).
testpaths = ["tests"]

[tool.ruff]
# Максимальная длина строки кода — как настройка Checkstyle.
line-length = 100
